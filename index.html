<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#16132e" />
    <title>Células - Gestão de Células</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet" />
    <script>
      (function() {
        var t = localStorage.getItem('celula-theme') || 'dark';
        document.documentElement.setAttribute('data-theme', t);
      })();
    </script>
    <style>
      [data-theme="dark"] body, [data-theme="dark"] #root-loader { background-color: #16132e; }
      [data-theme="light"] body, [data-theme="light"] #root-loader { background-color: #f4f3fa; }
      #root-loader {
        position: fixed; inset: 0; display: flex; align-items: center; justify-content: center;
        z-index: 9999;
      }
      #root-loader .dot { width: 8px; height: 8px; border-radius: 50%; background: #D9731A;
        animation: dotPulse 1.4s ease-in-out infinite; margin: 0 4px; }
      #root-loader .dot:nth-child(2) { animation-delay: 0.2s; }
      #root-loader .dot:nth-child(3) { animation-delay: 0.4s; }
      @keyframes dotPulse { 0%, 80%, 100% { transform: scale(0.6); opacity: 0.4; }
        40% { transform: scale(1); opacity: 1; } }
    </style>
  </head>
  <body class="font-sans antialiased">
    <div id="root-loader"><div class="dot"></div><div class="dot"></div><div class="dot"></div></div>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
